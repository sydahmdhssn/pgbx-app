<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#052414">
<title>PGBX Mobile Prototype</title>
<meta name="description" content="Clickable prototype of the PGBX customer app: live rates, buy, wallet and redeem at PGBX dealers. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g950:#03180d; --g900:#052414; --g800:#0B4A2C; --g700:#12603A; --g600:#1b7347;
  --gold:#C8962B; --gold-l:#E2B65A; --gold-d:#8A6414;
  --cream:#F7F4EC; --cream-2:#EFEADD; --card:#FFFFFF;
  --ink:#1D2B22; --muted:#5F6D64; --line:rgba(29,43,34,.10);
  --up:#1F8A4C; --down:#B3412E; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --serif:'Lora',Georgia,serif; --sans:'Lato',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --s:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#0f5a35 0%,#073019 45%,#03180d 100%);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- phone frame ---------- */
.device{position:absolute;left:50%;top:50%;width:390px;height:844px;box-sizing:content-box;border:9px solid #0a120d;border-radius:58px;
  transform:translate(-50%,-50%) scale(var(--s));background:var(--cream);overflow:hidden;
  box-shadow:0 0 0 1.5px #3b4a40,0 0 0 3px #0a120d,0 40px 90px rgba(0,0,0,.55),0 0 120px rgba(200,150,43,.08)}
.device-inner{position:absolute;inset:0;border-radius:49px;overflow:hidden;background:var(--cream);isolation:isolate}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-weight:700;font-size:15px;pointer-events:none;transition:color .4s var(--ease)}
.statusbar.light{color:#fff}.statusbar.dark{color:var(--ink)}
.statusbar .notch{position:absolute;left:50%;top:11px;width:122px;height:34px;border-radius:20px;background:#000;transform:translateX(-50%)}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.page-caption{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:rgba(226,182,90,.7);font-size:12px;letter-spacing:.08em;pointer-events:none}
@media (max-height:700px){.page-caption{display:none}}
.device-inner{--top:50px;--bot:0px}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
@media (max-width:500px){
  body{overflow:hidden}
  .device{left:0;top:0;width:100%;height:100%;height:100dvh;border:0;border-radius:0;transform:none;box-shadow:none}
  .device-inner{border-radius:0}
  .statusbar,.page-caption{display:none}
  .device-inner{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
}

/* ---------- generic ---------- */
.view{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:24px}
.scroll::-webkit-scrollbar{display:none}
.enter{animation:enter .55s var(--ease) both}
.cascade>*{animation:enter .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 60ms)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.pad{padding:0 18px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:24px 18px 10px}
.section-title h3{font-size:18px;color:var(--g800)}
.section-title span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 rgba(29,43,34,.04),0 8px 24px -12px rgba(11,74,44,.25);border:1px solid rgba(29,43,34,.05)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px;letter-spacing:.02em}
.tbc{display:inline-block;color:var(--warn);background:var(--warn-bg);border:1px dashed rgba(154,91,0,.4);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.sample{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);background:rgba(200,150,43,.13);border-radius:5px;padding:2px 6px;vertical-align:middle}
.press{transition:transform .18s var(--ease),opacity .2s var(--ease)}
.press:active{transform:scale(.965)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.01em;width:100%;transition:transform .18s var(--ease),opacity .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,#E7BE62,#C8962B 60%,#B4851F);color:#2a1d04;box-shadow:0 10px 24px -10px rgba(200,150,43,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-green{background:var(--g800);color:#fff;box-shadow:0 10px 24px -12px rgba(11,74,44,.9)}
.btn-ghost{background:transparent;color:var(--g800);border:1.5px solid rgba(11,74,44,.25)}
.btn-danger{background:transparent;color:var(--down);border:1.5px solid rgba(179,65,46,.35)}
.btn[disabled]{opacity:.42;pointer-events:none}
.icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:18px;height:18px}.icon.xs{width:14px;height:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.divider{height:1px;background:var(--line);margin:0 16px}
.up{color:var(--up)}.down{color:var(--down)}

/* ---------- top bar (sub screens) ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:calc(var(--top) + 4px) 10px 8px;background:var(--cream);position:relative;z-index:5}
.topbar h2{font-size:19px;color:var(--g800)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--g800);transition:transform .18s var(--ease),background .2s}
.iconbtn:active{transform:scale(.9)}
.tabhead{padding:calc(var(--top) + 10px) 18px 6px}
.tabhead h1{font-size:28px;color:var(--g800)}
.tabhead p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* ---------- tab bar ---------- */
.tabbar{position:relative;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(var(--bot) + 6px)}
.app.framed .tabbar{padding-bottom:22px}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.pill-track{position:absolute;top:0;bottom:0;left:0;width:20%;transition:transform .5s var(--ease);padding:2px 6px}
.pill{width:100%;height:100%;border-radius:16px;background:linear-gradient(180deg,rgba(200,150,43,.18),rgba(200,150,43,.08));border:1px solid rgba(200,150,43,.35)}
.tab{position:relative;z-index:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#7b867f;transition:color .3s var(--ease),transform .18s var(--ease)}
.tab:active{transform:scale(.92)}
.tab.on{color:var(--g800)}
.tab .icon{transition:transform .45s var(--spring)}
.tab.on .icon{transform:translateY(-1px) scale(1.08)}

/* ---------- splash ---------- */
.splash{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 42%,#11603a 0%,#0B4A2C 35%,#052414 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.splash.out{animation:splashOut .55s var(--ease) forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.04)}}
.coin{display:block;overflow:visible}
.coin .dots{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coin .ring{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.coin .face{transform-box:fill-box;transform-origin:center;animation:pop .9s .35s var(--ease) both}
.coin .emblem{transform-box:fill-box;transform-origin:center;animation:emblem 1s .75s var(--ease) both}
@keyframes emblem{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.coin .shine{animation:shine 2.6s 1.2s var(--ease) infinite}
@keyframes shine{0%{transform:translateX(-140px)}60%,100%{transform:translateX(160px)}}
.coin-wrap{position:relative;display:grid;place-items:center}
.glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(226,182,90,.35),rgba(226,182,90,0) 62%);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.splash-name{margin-top:28px;text-align:center;animation:enter 1s 1.25s var(--ease) both}
.splash-name h1{font-size:22px;letter-spacing:.02em;color:#fff}
.splash-tag{margin-top:10px;font-size:11px;font-weight:900;letter-spacing:.28em;color:var(--gold-l);animation:fadeIn 1s 1.7s var(--ease) both}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff3c8,#E2B65A 55%,rgba(200,150,43,0) 70%);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translate3d(var(--dx),-900px,0) scale(1.1);opacity:0}}
.splash-foot{position:absolute;bottom:calc(var(--bot) + 34px);font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.06em;animation:fadeIn 1s 2s both}

/* ---------- PIN ---------- */
.lock{position:absolute;inset:0;background:radial-gradient(100% 55% at 50% 18%,#12603A 0%,#0B4A2C 40%,#052414 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(var(--top) + 24px) 28px calc(var(--bot) + 18px);animation:fadeIn .5s var(--ease) both}
.lock h2{margin-top:18px;font-size:22px;animation:enter .6s .2s var(--ease) both}
.lock .proto{margin-top:6px;font-size:12px;color:rgba(255,255,255,.6);animation:enter .6s .28s var(--ease) both}
.lock .note{min-height:18px;margin-top:6px;font-size:13px;color:var(--gold-l)}
.dots4{display:flex;gap:18px;margin:22px 0 18px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(226,182,90,.7);position:relative}
.dot::after{content:'';position:absolute;inset:-1.5px;border-radius:50%;background:var(--gold-l);transform:scale(0);transition:transform .35s var(--spring),background .3s}
.dot.on::after{transform:scale(1)}
.dots4.ok .dot{border-color:#3fcf7c}.dots4.ok .dot::after{background:#3fcf7c;transform:scale(1)}
.dots4.ok{animation:okPulse .5s var(--ease)}
@keyframes okPulse{50%{transform:scale(1.08)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;margin-top:auto}
.key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:28px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(226,182,90,.18);animation:pop .5s var(--spring) both;transition:transform .15s var(--ease),background .2s}
.key:active{transform:scale(.88);background:rgba(226,182,90,.25)}
.key.plain{background:transparent;border-color:transparent}
.key.plain .kl{font-family:var(--sans);font-size:11px;font-weight:700;margin-top:2px;color:rgba(255,255,255,.75)}
.browse{margin-top:18px;min-height:44px;color:var(--gold-l);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;animation:fadeIn .8s .9s both}
.scan{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,36,20,.55);animation:fadeIn .25s both;z-index:3}
.scan-box{width:120px;height:120px;border-radius:30px;border:2px solid var(--gold-l);display:grid;place-items:center;color:var(--gold-l);animation:pop .4s var(--spring) both}
.scan-box .icon{width:56px;height:56px;stroke-width:1.4}

/* ---------- rates home ---------- */
.hero{background:radial-gradient(120% 100% at 80% 0%,#12603A 0%,#0B4A2C 45%,#052414 100%);color:#fff;padding:calc(var(--top) + 10px) 18px 92px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-60px;top:-40px;width:240px;height:240px;border-radius:50%;border:1px dashed rgba(226,182,90,.18)}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .brand b{font-family:var(--serif);font-size:17px}
.hero .brand small{display:block;font-size:11px;color:rgba(255,255,255,.65)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:rgba(255,255,255,.85);margin-top:16px}
.live i{width:8px;height:8px;border-radius:50%;background:#3fcf7c;position:relative}
.live i::after{content:'';position:absolute;inset:0;border-radius:50%;background:#3fcf7c;animation:ping 1.8s var(--ease) infinite}
.live.stale i,.live.stale i::after{background:#f0a23a}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}
.hero h1{font-size:24px;margin-top:6px}
.rate-stack{margin:-78px 14px 0;display:grid;gap:12px;position:relative;z-index:2}
.rate{border-radius:22px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(150deg,#12603A 0%,#0B4A2C 70%);box-shadow:0 18px 40px -18px rgba(5,36,20,.75);border:1px solid rgba(226,182,90,.25)}
.rate.silver{border-color:rgba(214,220,224,.3)}
.rate .top{display:flex;align-items:center;gap:10px}
.rate .metal{font-family:var(--serif);font-size:17px}
.rate .pur{font-size:11px;color:rgba(255,255,255,.6)}
.rate .chg{margin-left:auto}
.chg.upc{background:rgba(63,207,124,.16);color:#7be3a6}.chg.downc{background:rgba(240,110,90,.16);color:#ffab9b}
.rate .mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px}
.rate .lbl{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.price-big{font-family:var(--serif);font-size:27px;font-weight:700;margin-top:2px;color:var(--gold-l)}
.rate.silver .price-big{color:#E8EDF0}
.flash{position:relative;display:inline-block;isolation:isolate}
.flash::after{content:'';position:absolute;inset:-1px -6px;border-radius:8px;background:rgba(226,182,90,.55);z-index:-1;opacity:0;animation:flash 1.2s var(--ease)}
@keyframes flash{12%{opacity:1}100%{opacity:0}}
.rate .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.rate .grid3 b{display:block;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.spark{display:block}
.banner{margin:14px 14px 0;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.banner.warn{background:var(--warn-bg);color:#6b3f00;border:1px solid rgba(154,91,0,.25)}
.banner.info{background:#fff;border:1px solid var(--line);color:var(--ink)}
.banner b{display:block;font-size:14px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.feat{flex:none;width:148px;padding:14px;scroll-snap-align:start;text-align:left}
.feat .ing{height:62px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(180deg,#f7f1e2,#efe6cf)}
.feat.sil .ing{background:linear-gradient(180deg,#f2f4f5,#e3e7ea)}
.feat b{display:block;margin-top:10px;font-size:15px}
.feat .p{font-family:var(--serif);font-weight:700;color:var(--g800);margin-top:4px}
.wallet-sum{margin:0 14px;padding:18px;color:#fff;background:linear-gradient(140deg,#0B4A2C,#052414);border-radius:22px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 28px);display:block}
.wallet-sum::after{content:'';position:absolute;right:-30px;bottom:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(226,182,90,.25),rgba(226,182,90,0) 65%)}
.wallet-sum .v{font-family:var(--serif);font-size:26px;color:var(--gold-l);margin-top:4px}
.dealers-card{margin:12px 14px 0;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 28px)}
.badge-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(200,150,43,.14);color:var(--gold-d);flex:none}
.foot-note{margin:18px 18px 0;font-size:11px;line-height:1.5;color:var(--muted)}

/* ---------- buy ---------- */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--cream-2);border-radius:16px;padding:4px;margin:10px 18px 4px}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:#fff;box-shadow:0 4px 12px -4px rgba(11,74,44,.35);transition:transform .5s var(--spring)}
.seg button{position:relative;z-index:1;min-height:44px;font-weight:900;font-size:14px;color:var(--muted);transition:color .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{color:var(--g800)}
.plist{display:grid;gap:10px;padding:10px 18px 0}
.pcard{display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left;width:100%}
.pcard .ing{width:76px;height:56px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#f7f1e2,#efe6cf);flex:none}
.pcard.sil .ing{background:linear-gradient(180deg,#f2f4f5,#e3e7ea)}
.pcard b{font-size:17px;font-family:var(--serif)}
.pcard .pp{margin-left:auto;text-align:right}
.pcard .pp b{display:block;font-family:var(--serif);color:var(--g800);font-size:16px}
.offline{margin:12px 18px 0;padding:12px 14px;border:1.5px dashed rgba(200,150,43,.55);border-radius:16px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}

/* ---------- product ---------- */
.stage-ing{height:200px;display:grid;place-items:center;margin:4px 18px 0;border-radius:26px;background:radial-gradient(70% 70% at 50% 40%,#fff9ea,#efe3c4);position:relative;overflow:hidden}
.stage-ing.sil{background:radial-gradient(70% 70% at 50% 40%,#fbfcfd,#dfe4e8)}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-6px) rotate(-1.5deg)}50%{transform:translateY(6px) rotate(1.5deg)}}
.shadow{position:absolute;bottom:30px;width:150px;height:16px;border-radius:50%;background:rgba(60,40,0,.18);filter:blur(4px);animation:shadow 4s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 18px 0}
.tile{padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tile b{display:block;margin-top:4px;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:16px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--g800);box-shadow:0 2px 6px -2px rgba(11,74,44,.25);transition:transform .15s var(--ease),opacity .2s}
.stepper button:active{transform:scale(.88)}
.stepper button[disabled]{opacity:.35;pointer-events:none}
.stepper output{min-width:34px;text-align:center;font-family:var(--serif);font-size:20px;font-weight:700}
.stepper output span{display:inline-block;animation:pop .35s var(--spring)}
.lockbox{margin:14px 18px 0;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.bar{height:6px;border-radius:6px;background:var(--cream-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-l));transform-origin:left;transition:transform 1s linear}
.bar.low i{background:linear-gradient(90deg,#c0582f,#e48a54)}

<script type="module">
import { html, render, useState, useEffect, useRef, useMemo } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

/* ============================================================
   Constants (SRS references in comments)
   ============================================================ */
const TOLA = 11.664;                       // 1 tola = 11.664 g in every calculation
const params = new URLSearchParams(location.search);
const START_HOME = params.get('start') === 'home';

// Seed: Pakistan Sarafa 24K rate, 1 Oct 2026 (per tola)

];

const pname = p => `${p.label} ${metalName(p.metal)}`;

  { id: 'd1', name: 'Saddar Bullion Counter', area: 'Saddar, Karachi',       km: 1.2, hours: '10:00 – 20:00', out: [] },
  { id: 'd2', name: 'Clifton Gold Desk',      area: 'Clifton Block 5, Karachi', km: 4.8, hours: '11:00 – 21:00', out: ['s-1t', 's-10t', 'g-5g'] },

];

  Object.fromEntries(PRODUCTS.map(p => [p.id, d.out.includes(p.id) ? 0 : 3 + ((p.id.length * 7 + d.km * 10) | 0) % 9]))]));

/* ============================================================
   Helpers
   ============================================================ */
const fmt = n => 'Rs ' + Math.round(n).toLocaleString('en-US');
const fmtW = g => (g < 1 ? `${+(g * 1000).toFixed(0)} mg` : `${+g.toFixed(3)} g`);
const pct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const uid = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const dt = ts => new Date(ts).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ${s % 60}s ago`; };

function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// NOTE (Rule 1, FR-R3): in production every price comes from the PGBX server.
// This prototype simulates that server locally so the screens can be clicked through.
function rateOf(rates, metal) {

function seedHistory(end, vol, n = 36, seed = 7) {

// Append-only wallet ledger (FR-W3). Opening sample holdings: 2 × 1 tola silver, 1 × 1 g gold.
function initialLedger() {

function Spark({ data, metal, w = 112, h = 40 }) {
  const min = Math.min(...data), max = Math.max(...data), span = max - min || 1;
  const pts = data.map((v, i) => [(i / (data.length - 1)) * w, h - 3 - ((v - min) / span) * (h - 6)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const col = metal === 'gold' ? '#E2B65A' : '#E8EDF0';
  const last = pts[pts.length - 1];
  return html`<svg class="spark" width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} aria-hidden="true">
    <polygon points=${`0,${h} ${line} ${w},${h}`} fill=${metal === 'gold' ? 'url(#sparkFill)' : 'url(#sparkFillS)'}/>
    <polyline points=${line} fill="none" stroke=${col} stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx=${last[0]} cy=${last[1]} r="3" fill=${col}/>
  </svg>`;
}

function QR({ code }) {
  const N = 25, r = mulberry(+code * 7919 + 13); const cells = [];
  const finder = (x, y) => (x >= 0 && x < 7 && y >= 0 && y < 7);
  const inF = (x, y) => finder(x, y) || finder(x - (N - 7), y) || finder(x, y - (N - 7));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (!inF(x, y) && r() > 0.52) cells.push(html`<rect x=${x} y=${y} width="1" height="1"/>`); }
  const F = (x, y) => html`<g transform=${`translate(${x} ${y})`}><rect width="7" height="7" rx="1.2"/><rect x="1" y="1" width="5" height="5" rx=".8" fill="#fff"/><rect x="2" y="2" width="3" height="3" rx=".5"/></g>`;
  return html`<svg class="qr" viewBox=${`0 0 ${N} ${N}`} shape-rendering="crispEdges" aria-label="Redemption code pattern" fill="#0B4A2C">${cells}${F(0, 0)}${F(N - 7, 0)}${F(0, N - 7)}</svg>`;
}

function Splash({ onDone }) {
  const [out, setOut] = useState(false);
  const parts = useMemo(() => Array.from({ length: 22 }, (_, i) => ({
    left: (i * 37 % 100) + '%', dur: 5 + (i * 13 % 50) / 10, delay: (i * 7 % 30) / 10, dx: ((i * 23 % 60) - 30) + 'px', size: 2 + (i % 4),
  })), []);
  const finish = () => { if (out) return; setOut(true); setTimeout(onDone, 520); };
  useEffect(() => { const t = setTimeout(finish, 3100); return () => clearTimeout(t); }, []);
  return html`<div class=${'splash' + (out ? ' out' : '')} onClick=${finish}>
    <div class="particles">${parts.map(p => html`<span class="particle" style=${{ left: p.left, width: p.size + 'px', height: p.size + 'px', animationDuration: p.dur + 's', animationDelay: p.delay + 's', '--dx': p.dx }}></span>`)}</div>

function PinPad({ onComplete, ok, showFace, onFace }) {
  const [pin, setPin] = useState('');
  useEffect(() => { if (pin.length === 4) { const t = setTimeout(() => { onComplete(pin); setPin(p => (ok ? p : '')); }, 160); return () => clearTimeout(t); } }, [pin]);
  const press = d => setPin(p => (p.length < 4 ? p + d : p));
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'face', '0', 'del'];
  return html`
    <div class=${'dots4' + (ok ? ' ok' : '')} aria-label=${`${pin.length} of 4 digits entered`}>
      ${[0, 1, 2, 3].map(i => html`<span class=${'dot' + (pin.length > i || ok ? ' on' : '')}></span>`)}
    </div>
    <div class="keypad">
      ${keys.map((k, i) => {
        const st = { animationDelay: (0.25 + i * 0.045) + 's' };
        if (k === 'face') return showFace ? html`<button class="key plain" style=${st} onClick=${onFace} aria-label="Unlock with face"><div style="display:grid;justify-items:center"><${Icon} n="face"/><span class="kl">Face</span></div></button>` : html`<span></span>`;
        if (k === 'del') return html`<button class="key plain" style=${st} onClick=${() => setPin(p => p.slice(0, -1))} aria-label="Delete"><${Icon} n="del"/></button>`;
        return html`<button class="key" style=${st} onClick=${() => press(k)}>${k}</button>`;
      })}
    </div>`;
}

  const active = S.redemptions.filter(r => ['requested', 'ready'].includes(S.statusOf(r)));
  const past = S.redemptions.filter(r => !['requested', 'ready'].includes(S.statusOf(r)));
  const canConfirm = pid && did && units >= 1 && units <= avail(pid) && S.dealerStock[did][pid] >= units;
  return html`<div class="scroll">
    <${TabHead} title="Redeem" sub="Collect your metal at a PGBX dealer" />

        <div class="ing"><${Ingot} metal=${p.metal} w=${54} label=${p.short}/></div>
        <div><b>${pname(p)}</b><div class="tiny muted">${avail(p.id)} available${S.reserved[p.id] ? ` · ${S.reserved[p.id]} reserved` : ''}</div></div>

  const help = [

  return html`<div class="scroll">

    <div class="card profile enter">
      <div class="avatar">AK</div>

          <span class="lic"><${Icon} n=${r.icon} c="sm"/></span><b style="font-size:15px">${r.label}</b><span class="end"><span class=${'switch' + (S.biometric ? ' on' : '')}><i></i></span></span></button>`
        : html`<button class="li-row" style=${{ '--i': i }} onClick=${r.go}><span class="lic"><${Icon} n=${r.icon} c="sm"/></span><b style="font-size:15px">${r.label}</b><span class="end">${r.end || ''}<${Icon} n="chev" c="sm"/></span></button>`)}
    </div>

    <div class="card list cascade">
      ${help.map((r, i) => html`<button class="li-row" style=${{ '--i': i }} onClick=${() => A.push({ name: 'info', kind: r.kind })}><span class="lic"><${Icon} n=${r.icon} c="sm"/></span><b style="font-size:15px">${r.label}</b><span class="end"><${Icon} n="chev" c="sm"/></span></button>`)}

  </div>`;
}

function ChangePin({ A }) {
  const steps = ['Enter current PIN', 'Enter new PIN', 'Confirm new PIN'];
  const [step, setStep] = useState(0);
  const [ok, setOk] = useState(false);
  const done = () => { if (step < 2) setStep(step + 1); else { setOk(true); setTimeout(() => { A.toast('PIN changed (prototype)'); A.back(); }, 600); } };
  return html`<div class="lock" style="position:absolute;inset:0">
    <div style="position:absolute;left:10px;top:calc(var(--top) + 4px)"><button class="iconbtn" style="color:#fff" onClick=${A.back} aria-label="Back"><${Icon} n="back"/></button></div>
    <${Coin} size=${80} />
    <h2 key=${step}>${steps[step]}</h2>
    <div class="proto">Prototype: any 4 digits · real flow adds an OTP check</div>
    <div class="note"></div>
    <${PinPad} key=${step} ok=${ok} onComplete=${done} showFace=${false} />
  </div>`;
}

        html`<a class="li-row" style=${{ '--i': i, color: 'inherit', textDecoration: 'none' }} href=${href || null} target="_blank" rel="noopener"><span class="lic"><${Icon} n=${ic} c="sm"/></span><div><div class="tiny muted">${l}</div><b style="font-size:15px">${v}</b></div></a>`)}

      <div class="kv"><span>Redemption fee / making charge</span><span class="tbc">${TBC}</span></div>
      <div class="kv"><span>Storage fee or time limit</span><span class="tbc">${TBC}</span></div>

  else body = html`<div class="prose cascade">
      ${[['Ownership of metal in your wallet', 'How the wallet is classified and which approvals apply'], ['Fees and charges', 'Spread, redemption fee and any storage fee'], ['Redemption period', 'How long holdings can be kept and redeemed (FR-W7)'], ['Refunds and disputes', 'What happens in a dispute'], ['Shariah approval', 'Written approval of the product, wallet and redemption flow (CMP-3)'], ['Privacy policy', 'How personal data is collected, stored and deleted (CMP-6)']].map(([h, d], i) =>
        html`<div style=${{ '--i': i }}><h3>${h}</h3><p style="margin:0" class="muted">${d}.</p><p style="margin:6px 0 0"><span class="tbc">${TBC}</span></p></div>`)}
      <p class="foot-note" style="margin:20px 0 0">Customers accept these terms before their first purchase (CMP-5).</p>

  return html`<div class="page">

    <div class="scroll" style="top:calc(var(--top) + 60px)">${body}</div>
  </div>`;
}

function Report({ S, A }) {
  const opts = [...S.orders.map(o => ['o:' + o.id, `Order ${o.receipt}`]), ...S.redemptions.map(r => ['r:' + r.id, `Redemption ${r.code}`])];

/* ============================================================
   App (shared state)
   ============================================================ */
const TABS = [['rates', 'Rates'], ['buy', 'Buy'], ['wallet', 'Wallet'], ['redeem', 'Redeem'], ['account', 'Account']];

function App() {
  const [phase, setPhase] = useState(START_HOME ? 'app' : 'splash');
  const [st, setSt] = useState(() => ({
    guest: false, tab: 'rates', stack: [], buyMetal: 'gold', qty: 1, lock: null, method: 'bank', paying: false,
    rates: initialRates(), ledger: initialLedger(), orders: [], redemptions: [], dealerStock: initialDealerStock(),
    biometric: true, toast: null, lockNote: '',
  }));
  const [now, setNow] = useState(Date.now());
  const set = patch => setSt(s => ({ ...s, ...(typeof patch === 'function' ? patch(s) : patch) }));
  const lastActive = useRef(Date.now());
  const committed = useRef(new Set());       // idempotency (Rule 2 / NFR-1)
  const receipts = useRef(new Set());

  // 1 s clock + 5 s simulated rate ticks
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (FEED_FAIL) return;
    const t = setInterval(() => set(s => {
      const step = (m, vol) => { const b = Math.round(s.rates[m].buy * (1 + (Math.random() - 0.5) * vol)); return { ...s.rates[m], buy: b, hist: [...s.rates[m].hist.slice(1), b] }; };
      return { rates: { gold: step('gold', 0.003), silver: step('silver', 0.005), updatedAt: Date.now(), tick: s.rates.tick + 1 } };
    }), TICK_MS);
    return () => clearInterval(t);
  }, []);

  const stale = now - st.rates.updatedAt > STALE_MS;
  const top = st.stack[st.stack.length - 1];

  // FR-B2: refresh locked price at zero while on product / pay
  useEffect(() => {
    if (st.lock && top && (top.name === 'product' || top.name === 'pay') && now >= st.lock.expiresAt) {
      set(s => ({ lock: { ...s.lock, unit: priceOf(P[s.lock.pid], s.rates), expiresAt: Date.now() + LOCK_S * 1000 } }));
      toast('Price lock expired · refreshed to the latest rate');
    }
  }, [now]);

  // FR-A4: auto-lock after 2 minutes of inactivity
  useEffect(() => {
    if (phase === 'app' && !st.guest && !(top && top.name === 'processing') && now - lastActive.current > AUTOLOCK_MS) {
      set({ lockNote: 'Locked after 2 minutes of inactivity' }); setPhase('pin');
    }
  }, [now]);

  // Toast auto-dismiss
  useEffect(() => { if (!st.toast) return; const t = setTimeout(() => set({ toast: null }), 2800); return () => clearTimeout(t); }, [st.toast]);

  // Derived wallet state from the ledger (FR-W3)
  const holdings = useMemo(() => { const h = {}; st.ledger.forEach(e => { h[e.pid] = (h[e.pid] || 0) + e.delta; }); return h; }, [st.ledger]);
  const statusOf = r => ((r.status === 'requested' || r.status === 'ready') && now > r.expiresAt ? 'expired' : r.status);
  const reserved = {}; st.redemptions.forEach(r => { const s = statusOf(r); if (s === 'requested' || s === 'ready') reserved[r.pid] = (reserved[r.pid] || 0) + r.units; });
  const walletValue = (() => { let gold = 0, silver = 0, goldG = 0, silverG = 0; PRODUCTS.forEach(p => { const n = holdings[p.id] || 0; if (!n) return; const v = n * p.grams * rateOf(st.rates, p.metal).sellGram;
    if (p.metal === 'gold') { gold += v; goldG += n * p.grams; } else { silver += v; silverG += n * p.grams; } }); return { gold, silver, goldG, silverG, total: gold + silver }; })();

  function toast(msg) { set({ toast: { msg, id: Math.random() } }); }
  const A = {
    set, toast,
    tab: t => { if (st.guest && t !== 'rates') { A.login('Log in to use ' + t); return; } set({ tab: t, stack: [] }); },
    push: r => set(s => ({ stack: [...s.stack, r] })),
    back: () => set(s => ({ stack: s.stack.slice(0, -1) })),
    login: note => { set({ lockNote: typeof note === 'string' ? note : '' }); setPhase('pin'); },
    lockNow: () => { set({ lockNote: 'App locked', stack: [] }); setPhase('pin'); },
    openProduct: pid => {
      if (st.guest) { A.login('Log in to buy'); return; }
      const p = P[pid];
      set(s => ({ tab: s.tab === 'rates' ? 'rates' : 'buy', buyMetal: p.metal, qty: 1, stack: [...s.stack, { name: 'product', pid }], lock: { pid, unit: priceOf(p, s.rates), expiresAt: Date.now() + LOCK_S * 1000 } }));
    },
    toPay: () => { if (stale) return; set(s => ({ stack: [...s.stack, { name: 'pay', orderKey: 'K' + uid() + uid() }], paying: false })); },
    pay: () => {
      if (stale || st.paying) return;
      const key = top.orderKey; const snap = { pid: st.lock.pid, units: st.qty, unit: st.lock.unit, method: st.method };
      set(s => ({ paying: true, stack: [...s.stack, { name: 'processing' }] }));
      setTimeout(() => {
        if (committed.current.has(key)) return;      // process exactly once
        committed.current.add(key);
        const d = new Date(); let rno;
        do { rno = `PGBX-R-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${uid()}`; } while (receipts.current.has(rno));
        receipts.current.add(rno);
        const order = { id: key, receipt: rno, ...snap, total: snap.unit * snap.units, ts: Date.now() };
        set(s => ({
          paying: false, orders: [...s.orders, order],
          ledger: [...s.ledger, { id: 'L-' + uid(), ts: order.ts, pid: snap.pid, delta: snap.units, reason: 'purchase', ref: rno, price: snap.unit }],
          stack: [{ name: 'receipt', oid: key }], lock: null,
        }));
      }, 1800);
    },
    redeem: (pid, units, dealerId) => {
      const used = new Set(st.redemptions.map(r => r.code)); let code;
      do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (used.has(code));
      const r = { id: 'RD-' + uid(), pid, units, dealerId, code, createdAt: Date.now(), expiresAt: Date.now() + RESERVE_MS, status: 'requested' };
      set(s => ({ redemptions: [...s.redemptions, r], stack: [...s.stack, { name: 'code', rid: r.id }] }));
      toast(`${units} unit${units > 1 ? 's' : ''} reserved for 24 hours`);
    },
    cancelRedemption: id => { set(s => ({ redemptions: s.redemptions.map(r => (r.id === id ? { ...r, status: 'cancelled' } : r)) })); toast('Redemption cancelled · units released'); },
    markReady: id => { set(s => ({ redemptions: s.redemptions.map(r => (r.id === id && r.status === 'requested' ? { ...r, status: 'ready' } : r)) })); toast('Dealer marked the order ready'); },
    handOver: id => set(s => {
      const r = s.redemptions.find(x => x.id === id);
      if (!r || r.status !== 'ready') return {};      // a code works once (Rule 5)
      const p = P[r.pid]; const d = DEALERS.find(x => x.id === r.dealerId);
      const serials = Array.from({ length: r.units }, () => `PGBX-${p.metal === 'gold' ? 'AU' : 'AG'}-${Math.floor(100000 + Math.random() * 900000)}`);
      setTimeout(() => toast('Handed over · wallet updated'), 0);
      return {
        redemptions: s.redemptions.map(x => (x.id === id ? { ...x, status: 'completed', completedAt: Date.now(), serials } : x)),
        ledger: [...s.ledger, { id: 'L-' + uid(), ts: Date.now(), pid: r.pid, delta: -r.units, reason: 'redemption', ref: r.id, dealer: d.name, serials }],
        dealerStock: { ...s.dealerStock, [d.id]: { ...s.dealerStock[d.id], [r.pid]: s.dealerStock[d.id][r.pid] - r.units } },
      };
    }),
  };

  const S = { ...st, now, stale, holdings, reserved, walletValue, statusOf };
  const framed = typeof window !== 'undefined' && window.innerWidth > 500;

  let content;
  if (top) {
    if (top.name === 'product') content = html`<${ProductScreen} S=${S} A=${A} pid=${top.pid}/>`;
    else if (top.name === 'pay') content = html`<${PayScreen} S=${S} A=${A}/>`;
    else if (top.name === 'processing') content = html`<${Processing}/>`;
    else if (top.name === 'receipt') content = html`<${Receipt} S=${S} A=${A} oid=${top.oid}/>`;
    else if (top.name === 'code') content = html`<${CodeScreen} S=${S} A=${A} rid=${top.rid}/>`;
    else if (top.name === 'info') content = html`<${InfoScreen} S=${S} A=${A} kind=${top.kind}/>`;
    else if (top.name === 'changepin') content = html`<${ChangePin} A=${A}/>`;
  } else {
    const M = { rates: RatesHome, buy: BuyList, wallet: WalletScreen, redeem: RedeemScreen, account: AccountScreen }[st.tab];
    content = html`<${M} S=${S} A=${A}/>`;
  }
  const routeKey = st.tab + '/' + (top ? top.name + (top.pid || top.rid || top.kind || top.oid || '') : '');
  const darkTop = phase !== 'app' || (!top && st.tab === 'rates') || (top && top.name === 'changepin');
  const tabIdx = TABS.findIndex(t => t[0] === st.tab);
  const hideTabs = top && (top.name === 'processing' || top.name === 'changepin');

  return html`<div class="device" onPointerDown=${() => { lastActive.current = Date.now(); }} onKeyDown=${() => { lastActive.current = Date.now(); }}>
    <div class="device-inner">
      <${StatusBar} light=${darkTop} />
      ${phase === 'splash' && html`<${Splash} onDone=${() => setPhase('pin')} />`}
      ${phase === 'pin' && html`<${LockScreen} biometric=${st.biometric} note=${st.lockNote}
          onUnlock=${() => { lastActive.current = Date.now(); set({ guest: false, lockNote: '' }); setPhase('app'); }}
          onBrowse=${() => { set({ guest: true, tab: 'rates', stack: [], lockNote: '' }); setPhase('app'); }} />`}
      ${phase === 'app' && html`<div class=${'app' + (framed ? ' framed' : '')}>
        <div class="view"><div class="enter" key=${routeKey} style="position:absolute;inset:0">${content}</div></div>
        ${!hideTabs && html`<nav class="tabbar" aria-label="Main"><div class="tabs">
          <div class="pill-track" style=${{ transform: `translateX(${tabIdx * 100}%)` }}><div class="pill"></div></div>
          ${TABS.map(([k, l]) => html`<button class=${'tab' + (st.tab === k ? ' on' : '')} onClick=${() => A.tab(k)} aria-current=${st.tab === k ? 'page' : null}>
            <${Icon} n=${k}/>${l}${st.guest && k !== 'rates' ? html`<span style="position:absolute;top:6px;right:calc(50% - 18px);opacity:.6"><${Icon} n="lock" c="xs"/></span>` : ''}</button>`)}
        </div></nav>`}
        ${st.toast && html`<div class="toast" key=${st.toast.id} role="status"><${Icon} n="info" c="sm"/>${st.toast.msg}</div>`}
      </div>`}
    </div>
  </div>`;
}

function StatusBar({ light }) {
  const [t, setT] = useState(() => new Date());
  useEffect(() => { const i = setInterval(() => setT(new Date()), 15000); return () => clearInterval(i); }, []);
  return html`<div class=${'statusbar ' + (light ? 'light' : 'dark')} aria-hidden="true">
    <span>${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}</span><span class="notch"></span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0M4 7.3a6 6 0 0 1 8 0"/><circle cx="8" cy="10.2" r="1.1" fill="currentColor" stroke="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.2" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.6" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>`;
}

/* Fit the 390×844 phone frame into the desktop window */
function fit() { const s = Math.min(1, (innerHeight - 48) / 862, (innerWidth - 32) / 408); document.documentElement.style.setProperty('--s', Math.max(0.4, s).toFixed(4)); }
addEventListener('resize', fit); fit();

render(html`<${App}/>`, document.getElementById('root'));
