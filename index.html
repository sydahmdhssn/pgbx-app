<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#052414">
<title>PGBX Mobile Prototype</title>
<meta name="description" content="Clickable prototype of the PGBX customer app: live rates, buy, wallet and redeem at PGBX dealers. Sample customer data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:wght@500;600;700&display=swap" rel="stylesheet" media="print" id="fonts">
<noscript><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --g950:#03180d; --g900:#052414; --g800:#0B4A2C; --g700:#12603A; --g600:#1b7347;
  --gold:#C8962B; --gold-l:#E2B65A; --gold-d:#8A6414;
  --cream:#F7F4EC; --cream-2:#EFEADD; --card:#FFFFFF;
  --ink:#1D2B22; --muted:#5F6D64; --line:rgba(29,43,34,.10);
  --up:#1F8A4C; --down:#B3412E; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --inout:cubic-bezier(.65,0,.35,1);
  --serif:'Lora',Georgia,serif; --sans:'Lato',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --s:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#0f5a35 0%,#073019 45%,#03180d 100%);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- phone frame ---------- */
.device{position:absolute;left:50%;top:50%;width:390px;height:844px;box-sizing:content-box;border:9px solid #0a120d;border-radius:58px;
  transform:translate(-50%,-50%) scale(var(--s));background:var(--cream);overflow:hidden;
  box-shadow:0 0 0 1.5px #3b4a40,0 0 0 3px #0a120d,0 40px 90px rgba(0,0,0,.55),0 0 120px rgba(200,150,43,.08)}
.device-inner{position:absolute;inset:0;border-radius:49px;overflow:hidden;background:var(--cream);isolation:isolate;--top:50px;--bot:0px}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-weight:700;font-size:15px;pointer-events:none;transition:color .4s var(--ease)}
.statusbar.light{color:#fff}.statusbar.dark{color:var(--ink)}
.statusbar .notch{position:absolute;left:50%;top:11px;width:122px;height:34px;border-radius:20px;background:#000;transform:translateX(-50%)}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.page-caption{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:rgba(226,182,90,.7);font-size:12px;letter-spacing:.08em;pointer-events:none}
@media (max-height:700px){.page-caption{display:none}}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
@media (max-width:500px){
  .device{left:0;top:0;width:100%;height:100%;height:100dvh;border:0;border-radius:0;transform:none;box-shadow:none}
  .device-inner{border-radius:0;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
  .statusbar,.page-caption{display:none}
}

/* ---------- generic ---------- */
.view{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:24px}
.scroll::-webkit-scrollbar{display:none}
.enter{animation:enter .55s var(--ease) both}
.enter-fwd{animation:inFwd .5s var(--ease) both}
.enter-back{animation:inBack .5s var(--ease) both}
.cascade>*{animation:enter .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 60ms)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pad{padding:0 18px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:24px 18px 10px}
.section-title h3{font-size:18px;color:var(--g800)}
.section-title span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 rgba(29,43,34,.04),0 8px 24px -12px rgba(11,74,44,.25);border:1px solid rgba(29,43,34,.05)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px;letter-spacing:.02em}
.tbc{display:inline-block;color:var(--warn);background:var(--warn-bg);border:1px dashed rgba(154,91,0,.4);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.press{transition:transform .18s var(--ease),opacity .2s var(--ease)}
.press:active{transform:scale(.965)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.01em;width:100%;transition:transform .18s var(--ease),opacity .25s var(--ease);position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,#E7BE62,#C8962B 60%,#B4851F);color:#2a1d04;box-shadow:0 10px 24px -10px rgba(200,150,43,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-140%) skewX(-16deg);animation:btnSheen 4.5s 1s var(--ease) infinite;pointer-events:none}
@keyframes btnSheen{0%{transform:translateX(-140%) skewX(-16deg)}30%,100%{transform:translateX(330%) skewX(-16deg)}}
.btn-green{background:var(--g800);color:#fff;box-shadow:0 10px 24px -12px rgba(11,74,44,.9)}
.btn-ghost{background:transparent;color:var(--g800);border:1.5px solid rgba(11,74,44,.25)}
.btn-danger{background:transparent;color:var(--down);border:1.5px solid rgba(179,65,46,.35)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn[disabled]::after{display:none}
.mini-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(42,29,4,.25);border-top-color:#2a1d04;animation:spin .7s linear infinite}
.icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:18px;height:18px}.icon.xs{width:14px;height:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.up{color:var(--up)}.down{color:var(--down)}

/* ---------- odometer (rolling digits) ---------- */
.odo{position:relative;display:inline-flex;align-items:flex-start;isolation:isolate;white-space:nowrap;line-height:1.2em}
.odo>span{height:1.2em;line-height:1.2em}
.odo-col{display:inline-block;overflow:hidden}
.odo-strip{display:block;transition:transform 1.1s var(--ease);will-change:transform}
.odo-strip i{display:block;height:1.2em;font-style:normal;text-align:center}
.odo-fl{position:absolute;inset:-1px -6px;border-radius:8px;background:rgba(226,182,90,.5);z-index:-1;opacity:0;animation:flash 1.3s var(--ease)}
@keyframes flash{12%{opacity:1}100%{opacity:0}}

/* ---------- top bar (sub screens) ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:calc(var(--top) + 4px) 10px 8px;background:var(--cream);position:relative;z-index:5}
.topbar h2{font-size:19px;color:var(--g800)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--g800);transition:transform .18s var(--ease)}
.iconbtn:active{transform:scale(.9)}
.tabhead{padding:calc(var(--top) + 10px) 18px 6px}
.tabhead h1{font-size:28px;color:var(--g800)}
.tabhead p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* ---------- tab bar ---------- */
.tabbar{position:relative;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(var(--bot) + 6px);animation:tabIn .6s var(--ease) both}
@keyframes tabIn{from{transform:translateY(100%)}to{transform:none}}
.app.framed .tabbar{padding-bottom:22px}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.pill-track{position:absolute;top:0;bottom:0;left:0;width:20%;transition:transform .55s var(--spring);padding:2px 6px}
.pill{width:100%;height:100%;border-radius:16px;background:linear-gradient(180deg,rgba(200,150,43,.2),rgba(200,150,43,.08));border:1px solid rgba(200,150,43,.38)}
.tab{position:relative;z-index:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#7b867f;transition:color .3s var(--ease),transform .18s var(--ease)}
.tab:active{transform:scale(.92)}
.tab.on{color:var(--g800)}
.tab .icon{transition:transform .45s var(--spring)}
.tab.on .icon{transform:translateY(-1px) scale(1.1)}

/* ---------- logo coin ---------- */
.coin{display:block;overflow:visible}
.coin .dots{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.coin .ring{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.coin .face{transform-box:fill-box;transform-origin:center;animation:pop .9s .3s var(--ease) both}
.coin .emblem{transform-box:fill-box;transform-origin:center;animation:emblem 1s .75s var(--ease) both}
@keyframes emblem{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.coin .shine{animation:shine 2.6s 1.2s var(--ease) infinite}
@keyframes shine{0%{transform:translateX(-140px)}60%,100%{transform:translateX(160px)}}
.coin-wrap{position:relative;display:grid;place-items:center}
.coin.static .ring{stroke-dashoffset:0;animation:none}.coin.static .face,.coin.static .emblem{animation:none}
.glow{position:absolute;inset:-32%;border-radius:50%;background:radial-gradient(circle,rgba(226,182,90,.38),rgba(226,182,90,0) 62%);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.coin-sweep{position:absolute;inset:9%;border-radius:50%;overflow:hidden;pointer-events:none}
.coin-sweep i{position:absolute;top:-10%;bottom:-10%;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,244,210,.5),transparent);transform:translateX(-160%) skewX(-12deg);animation:sweep 4.8s var(--sweep-delay,2.7s) var(--ease) infinite}
@keyframes sweep{0%{transform:translateX(-160%) skewX(-12deg)}32%,100%{transform:translateX(420%) skewX(-12deg)}}

/* ---------- splash ---------- */
.splash{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 42%,#11603a 0%,#0B4A2C 35%,#052414 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.rays{position:absolute;left:50%;top:44%;width:980px;height:980px;margin:-490px 0 0 -490px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(226,182,90,.11) 0deg 3deg,rgba(226,182,90,0) 3deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 14%,transparent 58%);mask:radial-gradient(circle,#000 0,#000 14%,transparent 58%);
  opacity:0;animation:raysIn 1.8s .3s var(--ease) forwards,spin 70s linear infinite;will-change:transform}
@keyframes raysIn{to{opacity:1}}
.vignette{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 45%,transparent 40%,rgba(2,14,8,.65) 100%);pointer-events:none}
.splash-center{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-30px}
.coin-stage{position:relative;perspective:900px;display:grid;place-items:center;animation:coinIn 1s var(--ease) both}
@keyframes coinIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.coin-flip{animation:flip 1.3s 1.55s var(--inout) both;will-change:transform}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
.ember{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff6d6,#E2B65A 55%,rgba(226,182,90,0) 72%);opacity:0;animation:ember 1.2s 1.42s var(--ease) both}
@keyframes ember{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}
.splash-title{margin-top:30px;font-size:23px;letter-spacing:.01em;color:#fff;text-align:center;padding:0 20px}
.letters .w{display:inline-block;white-space:nowrap}
.letters .l{display:inline-block;animation:letter .75s var(--ease) both}
@keyframes letter{from{opacity:0;transform:translateY(16px) rotate(5deg)}to{opacity:1;transform:none}}
.splash-tag{margin-top:12px;display:flex;gap:10px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--gold-l)}
.splash-tag span{animation:enter .7s var(--ease) both}
.splash-tag i{width:3px;height:3px;border-radius:50%;background:rgba(226,182,90,.6);animation:pop .5s var(--spring) both}
.splash-load{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 40px);display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadeIn .8s .9s both}
.splash-load .bar{width:132px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin:0}
.splash-load .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff1c4);transform-origin:left;animation:load 3.4s .5s var(--inout) both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.splash-load span{font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.6)}
.splash-load span b{color:#7be3a6;font-weight:900}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff3c8,#E2B65A 55%,rgba(200,150,43,0) 70%);opacity:0;animation:rise linear infinite;will-change:transform}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translate3d(var(--dx),-900px,0) scale(1.1);opacity:0}}
.splash.out{animation:fadeOut .6s .12s var(--ease) forwards}
.splash.out .coin-stage{animation:coinOut .65s var(--ease) forwards}
.splash.out .splash-title,.splash.out .splash-tag,.splash.out .splash-load{animation:fadeOut .35s var(--ease) forwards}
@keyframes coinOut{to{opacity:0;transform:scale(1.55)}}

/* ---------- login ---------- */
.login{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0d5333 0%,#08391f 50%,#052414 100%);color:#fff;display:flex;flex-direction:column;animation:fadeIn .5s var(--ease) both}
.aurora{position:absolute;width:440px;height:440px;border-radius:50%;pointer-events:none;will-change:transform}
.aurora.a{left:-170px;top:-140px;background:radial-gradient(circle,rgba(226,182,90,.32),rgba(226,182,90,0) 65%);animation:drift1 14s ease-in-out infinite alternate}
.aurora.b{right:-200px;top:140px;background:radial-gradient(circle,rgba(40,160,95,.45),rgba(40,160,95,0) 65%);animation:drift2 17s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(90px,70px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-90px,-50px) scale(1.12)}}
.login-top{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--top) + 8px) 24px 16px;text-align:center}
.halo{position:absolute;width:260px;height:260px;border-radius:50%;border:1px dashed rgba(226,182,90,.28);animation:spin 50s linear infinite,fadeIn 1.4s .5s both}
.halo.two{width:330px;height:330px;border-style:solid;border-color:rgba(226,182,90,.08);animation:spin 80s linear infinite reverse,fadeIn 1.4s .8s both}
.login-logo{position:relative;perspective:900px}
.login-logo .in{animation:logoIn 1.35s var(--spring) both}
@keyframes logoIn{0%{opacity:0;transform:translateY(30px) scale(.35) rotateY(-220deg)}55%{opacity:1}100%{opacity:1;transform:none}}
.login-logo .float{animation:float2 5s 1.5s ease-in-out infinite}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.orbit{position:absolute;inset:-16px;border-radius:50%;animation:spin 7s linear infinite,fadeIn .9s 1.3s both;pointer-events:none}
.orbit i{position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff3c8;box-shadow:0 0 10px 3px rgba(226,182,90,.75)}
.login-top h1{margin-top:20px;font-size:26px}
.login-top p{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.7);animation:enter .8s 1.25s var(--ease) both}
.ticker{display:flex;gap:10px;margin-top:16px;animation:enter .8s 1.45s var(--ease) both}
.tick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(226,182,90,.22);font-size:11px;color:rgba(255,255,255,.7);min-width:132px}
.tick b{font-family:var(--serif);font-size:15px;color:var(--gold-l)}
.tick.sil b{color:#E8EDF0}
.tick .lv{display:flex;align-items:center;gap:6px}
.ldot{width:7px;height:7px;border-radius:50%;background:#3fcf7c;position:relative;flex:none}
.ldot::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.8s var(--ease) infinite}
.ldot.sim,.ldot.stale{background:#f0a23a}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}
.sheet{position:relative;background:var(--cream);color:var(--ink);border-radius:30px 30px 0 0;padding:20px 22px calc(var(--bot) + 22px);animation:sheetUp .9s .6s var(--ease) both;box-shadow:0 -24px 50px -24px rgba(0,0,0,.6)}
@keyframes sheetUp{from{transform:translateY(105%)}to{transform:none}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(29,43,34,.16);margin:-6px auto 14px}
.sheet h2{font-size:21px;color:var(--g800)}
.sheet .sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.step-in{animation:inFwd .5s var(--ease) both}
.step-back{animation:inBack .5s var(--ease) both}
.field{display:flex;align-items:center;margin-top:16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;transition:border-color .25s;overflow:hidden}
.field:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,150,43,.14)}
.field.bad{border-color:rgba(179,65,46,.6)}
.otp.err{animation:shake .45s var(--ease)}
.field .cc{padding:0 12px 0 16px;height:56px;display:flex;align-items:center;gap:6px;font-weight:900;color:var(--g800);border-right:1px solid var(--line)}
.field input{flex:1;min-width:0;height:56px;border:0;outline:0;background:transparent;font:inherit;font-size:18px;font-weight:700;letter-spacing:.06em;padding:0 14px;color:var(--ink)}
.field input::placeholder{color:#b3bcb6;font-weight:400}
.field .okc{margin-right:14px;width:24px;height:24px;border-radius:50%;background:var(--up);color:#fff;display:grid;place-items:center;animation:pop .4s var(--spring) both}
.field .okc .icon{width:14px;height:14px;stroke-width:3}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;width:100%;height:100%;cursor:text;border:0}
.ob{height:56px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-weight:700;color:var(--g800);transition:border-color .25s,background-color .3s}
.ob.cur{border-color:var(--gold)}
.ob.cur::after{content:'';width:2px;height:24px;border-radius:2px;background:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ob span{display:inline-block;animation:pop .32s var(--spring) both}
.otp.ok .ob{border-color:#2fa860;background-color:#ecf8f0;color:var(--up);animation:okBounce .5s var(--spring) both}
@keyframes okBounce{40%{transform:translateY(-6px)}100%{transform:none}}
.linkbtn{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--g700)}
.linkbtn[disabled]{opacity:.5;cursor:default}
.login-links{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.login.out{animation:fadeOut .55s .15s var(--ease) forwards}
.login.out .sheet{animation:sheetDown .55s var(--ease) forwards}
.login.out .login-logo{animation:coinOut .6s var(--ease) forwards}
@keyframes sheetDown{to{transform:translateY(105%)}}

/* ---------- PIN ---------- */
.lock{position:absolute;inset:0;background:radial-gradient(100% 55% at 50% 18%,#12603A 0%,#0B4A2C 40%,#052414 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(var(--top) + 24px) 28px calc(var(--bot) + 14px);animation:fadeIn .5s var(--ease) both}
.lock h2{margin-top:18px;font-size:22px;animation:enter .6s .2s var(--ease) both}
.lock .proto{margin-top:6px;font-size:12px;color:rgba(255,255,255,.6);animation:enter .6s .28s var(--ease) both}
.lock .note{min-height:18px;margin-top:6px;font-size:13px;color:var(--gold-l)}
.dots4{display:flex;gap:18px;margin:22px 0 18px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(226,182,90,.7);position:relative}
.dot::after{content:'';position:absolute;inset:-1.5px;border-radius:50%;background:var(--gold-l);transform:scale(0);transition:transform .35s var(--spring),background-color .3s}
.dot.on::after{transform:scale(1)}
.dots4.ok .dot{border-color:#3fcf7c}.dots4.ok .dot::after{background:#3fcf7c;transform:scale(1)}
.dots4.ok{animation:okPulse .5s var(--ease)}
@keyframes okPulse{50%{transform:scale(1.08)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;margin-top:auto}
.key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:28px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(226,182,90,.18);animation:pop .5s var(--spring) both;transition:transform .15s var(--ease),background-color .2s}
.key:active{transform:scale(.88);background-color:rgba(226,182,90,.25)}
.key.plain{background:transparent;border-color:transparent}
.key.plain .kl{font-family:var(--sans);font-size:11px;font-weight:700;margin-top:2px;color:rgba(255,255,255,.75)}
.browse{margin-top:12px;min-height:44px;color:var(--gold-l);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;animation:fadeIn .8s .9s both}
.browse.dim{margin-top:0;color:rgba(255,255,255,.65);font-size:13px}
.scan{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,36,20,.55);animation:fadeIn .25s both;z-index:3}
.scan-box{width:120px;height:120px;border-radius:30px;border:2px solid var(--gold-l);display:grid;place-items:center;color:var(--gold-l);animation:pop .4s var(--spring) both}
.scan-box .icon{width:56px;height:56px;stroke-width:1.4}

/* ---------- rates home ---------- */
.hero{background:radial-gradient(120% 100% at 80% 0%,#12603A 0%,#0B4A2C 45%,#052414 100%);color:#fff;padding:calc(var(--top) + 10px) 18px 92px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-60px;top:-40px;width:240px;height:240px;border-radius:50%;border:1px dashed rgba(226,182,90,.2);animation:spin 60s linear infinite}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .brand b{font-family:var(--serif);font-size:17px}
.hero .brand small{display:block;font-size:11px;color:rgba(255,255,255,.65)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:rgba(255,255,255,.85);margin-top:16px}
.hero h1{font-size:24px;margin-top:6px}
.rate-stack{margin:-78px 14px 0;display:grid;gap:12px;position:relative;z-index:2}
.rate{border-radius:22px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(150deg,#12603A 0%,#0B4A2C 70%);box-shadow:0 18px 40px -18px rgba(5,36,20,.75);border:1px solid rgba(226,182,90,.28)}
.rate::before{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.11),transparent);transform:translateX(-120%) skewX(-14deg);animation:sheen 7s 1.6s var(--ease) infinite;pointer-events:none}
.rate.silver::before{animation-delay:2.6s;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent)}
@keyframes sheen{0%{transform:translateX(-120%) skewX(-14deg)}30%,100%{transform:translateX(330%) skewX(-14deg)}}
.rate.silver{border-color:rgba(214,220,224,.3)}
.rate .top{display:flex;align-items:center;gap:10px}
.rate .metal{font-family:var(--serif);font-size:17px}
.rate .pur{font-size:11px;color:rgba(255,255,255,.6)}
.rate .chg{margin-left:auto}
.chg.upc{background:rgba(63,207,124,.16);color:#7be3a6}.chg.downc{background:rgba(240,110,90,.16);color:#ffab9b}
.rate .mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px}
.rate .lbl{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.price-big{font-family:var(--serif);font-size:27px;font-weight:700;margin-top:2px;color:var(--gold-l)}
.rate.silver .price-big{color:#E8EDF0}
.rate .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.rate .grid3 b{display:block;font-size:14px;margin-top:2px}
.spark{display:block}
.sk{display:block;border-radius:8px;background:rgba(255,255,255,.09);position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:translateX(-100%);animation:skel 1.3s ease-in-out infinite}
@keyframes skel{to{transform:translateX(100%)}}
.banner{margin:14px 14px 0;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.banner.warn{background:var(--warn-bg);color:#6b3f00;border:1px solid rgba(154,91,0,.25)}
.banner.info{background:#fff;border:1px solid var(--line);color:var(--ink)}
.banner b{display:block;font-size:14px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.feat{flex:none;width:148px;padding:14px;scroll-snap-align:start;text-align:left}
.feat .ing{height:62px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(180deg,#f7f1e2,#efe6cf)}
.feat.sil .ing{background:linear-gradient(180deg,#f2f4f5,#e3e7ea)}
.feat b{display:block;margin-top:10px;font-size:15px}
.feat .p{font-family:var(--serif);font-weight:700;color:var(--g800);margin-top:4px}
.wcard{flex:none;width:150px;padding:12px 14px;scroll-snap-align:start}
.wcard .sym{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.wcard b{display:block;font-family:var(--serif);font-size:19px;color:var(--g800);margin-top:2px}
.wdot{width:10px;height:10px;border-radius:50%}
.wallet-sum{margin:0 14px;padding:18px;color:#fff;background:linear-gradient(140deg,#0B4A2C,#052414);border-radius:22px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 28px);display:block}
.wallet-sum::after{content:'';position:absolute;right:-30px;bottom:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(226,182,90,.25),rgba(226,182,90,0) 65%)}
.wallet-sum .v{font-family:var(--serif);font-size:26px;color:var(--gold-l);margin-top:4px}
.dealers-card{margin:12px 14px 0;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 28px)}
.badge-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(200,150,43,.14);color:var(--gold-d);flex:none}
.foot-note{margin:18px 18px 0;font-size:11px;line-height:1.5;color:var(--muted)}

/* ---------- buy ---------- */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--cream-2);border-radius:16px;padding:4px;margin:10px 18px 4px}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:#fff;box-shadow:0 4px 12px -4px rgba(11,74,44,.35);transition:transform .5s var(--spring)}
.seg button{position:relative;z-index:1;min-height:44px;font-weight:900;font-size:14px;color:var(--muted);transition:color .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{color:var(--g800)}
.plist{display:grid;gap:10px;padding:10px 18px 0}
.pcard{display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left;width:100%}
.pcard .ing{width:76px;height:56px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#f7f1e2,#efe6cf);flex:none}
.pcard.sil .ing{background:linear-gradient(180deg,#f2f4f5,#e3e7ea)}
.pcard b{font-size:17px;font-family:var(--serif)}
.pcard .pp{margin-left:auto;text-align:right}
.pcard .pp b{display:block;font-family:var(--serif);color:var(--g800);font-size:16px}
.offline{margin:12px 18px 0;padding:12px 14px;border:1.5px dashed rgba(200,150,43,.55);border-radius:16px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}

/* ---------- product ---------- */
.stage-ing{height:200px;display:grid;place-items:center;margin:4px 18px 0;border-radius:26px;background:radial-gradient(70% 70% at 50% 40%,#fff9ea,#efe3c4);position:relative;overflow:hidden}
.stage-ing.sil{background:radial-gradient(70% 70% at 50% 40%,#fbfcfd,#dfe4e8)}
.stage-ing::after{content:'';position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%) skewX(-14deg);animation:sheen 5s 1s var(--ease) infinite;pointer-events:none}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-6px) rotate(-1.5deg)}50%{transform:translateY(6px) rotate(1.5deg)}}
.shadow{position:absolute;bottom:30px;width:150px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,0,.22),rgba(60,40,0,0));animation:shadow 4s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 18px 0}
.tile{padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tile b{display:block;margin-top:4px;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:16px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--g800);box-shadow:0 2px 6px -2px rgba(11,74,44,.25);transition:transform .15s var(--ease),opacity .2s}
.stepper button:active{transform:scale(.88)}
.stepper button[disabled]{opacity:.35;pointer-events:none}
.stepper output{min-width:34px;text-align:center;font-family:var(--serif);font-size:20px;font-weight:700}
.stepper output span{display:inline-block;animation:pop .35s var(--spring)}
.lockbox{margin:14px 18px 0;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.bar{height:6px;border-radius:6px;background:var(--cream-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-l));transform-origin:left;transition:transform 1s linear}
.bar.low i{background:linear-gradient(90deg,#c0582f,#e48a54)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 18px 12px}
.total b{font-family:var(--serif);font-size:26px;color:var(--g800)}
.cta{padding:10px 18px 0}

/* ---------- pay ---------- */
.summary{margin:6px 18px 0;padding:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.methods{display:grid;gap:10px;margin:0 18px}
.method{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:#fff;border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .3s var(--ease),transform .18s var(--ease)}
.method:active{transform:scale(.98)}
.method.on{border-color:var(--gold);box-shadow:0 8px 20px -14px rgba(200,150,43,.9)}
.method .mi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(11,74,44,.08);color:var(--g800);flex:none}
.radio{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid #b8c0bb;display:grid;place-items:center;flex:none;transition:border-color .3s}
.radio i{width:10px;height:10px;border-radius:50%;background:var(--gold);transform:scale(0);transition:transform .4s var(--spring)}
.on>.radio,.radio.on{border-color:var(--gold)}
.on>.radio i,.radio.on i{transform:scale(1)}

/* ---------- processing / receipt ---------- */
.center-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.spinner{width:72px;height:72px;animation:spin 1s linear infinite}
.proc-steps{margin-top:22px;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.proc-steps div{animation:enter .5s var(--ease) both}
.check-wrap{position:relative;width:110px;height:110px;margin:calc(var(--top) + 18px) auto 0;display:grid;place-items:center}
.ripple{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ripple 2.4s var(--ease) infinite}
.ripple:nth-child(2){animation-delay:.8s}.ripple:nth-child(3){animation-delay:1.6s}
@keyframes ripple{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.check-disc{width:96px;height:96px;border-radius:50%;background:linear-gradient(150deg,#12603A,#0B4A2C);display:grid;place-items:center;animation:pop .6s var(--spring) both;box-shadow:0 14px 30px -12px rgba(11,74,44,.9)}
.check-disc path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s .45s var(--ease) forwards}
.receipt{margin:20px 18px 0;padding:6px 16px 10px;position:relative}
.receipt::before{content:'';position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--gold),var(--gold-l))}
.rno{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.04em}

/* ---------- wallet ---------- */
.wallet-hero{margin:8px 14px 0;padding:20px 18px;border-radius:24px;color:#fff;background:linear-gradient(145deg,#12603A,#052414);position:relative;overflow:hidden}
.wallet-hero::before{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.09),transparent);transform:translateX(-120%) skewX(-14deg);animation:sheen 8s 1s var(--ease) infinite;pointer-events:none}
.wallet-hero .v{font-family:var(--serif);font-size:32px;color:var(--gold-l);margin-top:4px}
.wallet-hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.wallet-hero .split div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.wallet-hero .split b{display:block;font-size:16px;margin-top:2px}
.hold{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hold .cnt{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--g800);min-width:44px}
.ledger-item{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.ledger-item .li{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.li.plus{background:rgba(31,138,76,.12);color:var(--up)}.li.minus{background:rgba(179,65,46,.1);color:var(--down)}.li.open{background:rgba(200,150,43,.14);color:var(--gold-d)}

/* ---------- redeem ---------- */
.choice{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;transition:border-color .3s var(--ease),transform .18s var(--ease),opacity .3s}
.choice:active{transform:scale(.98)}
.choice.on{border-color:var(--gold)}
.choice.off{opacity:.45;pointer-events:none;filter:grayscale(1)}
.choice .ing{width:58px;height:42px;display:grid;place-items:center;flex:none}
.stock{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.stock.in{background:rgba(31,138,76,.12);color:var(--up)}.stock.out{background:rgba(179,65,46,.1);color:var(--down)}
.stack{display:grid;gap:10px;margin:0 18px}
.cnic{margin:14px 18px 0;padding:12px 14px;border-radius:16px;background:rgba(11,74,44,.07);display:flex;gap:10px;font-size:13px;line-height:1.45;color:var(--g800)}

/* ---------- code ---------- */
.code-card{margin:6px 18px 0;padding:20px 16px;text-align:center}
.code-digits{display:flex;justify-content:center;gap:8px;margin-top:8px}
.code-digits span{width:40px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;color:var(--g800);background:var(--cream);border:1px solid rgba(200,150,43,.35);animation:pop .45s var(--spring) both}
.qr{margin:16px auto 6px;width:156px;height:156px;padding:8px;background:#fff;border-radius:14px;border:1px solid var(--line);animation:fadeIn .8s .3s both}
.steps{display:flex;align-items:flex-start;margin:18px 6px 4px}
.step{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.step .sd{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--cream-2);color:var(--muted);position:relative;z-index:1;transition:background-color .4s,color .4s}
.step .sd .icon{width:14px;height:14px;stroke-width:2.6}
.step.done .sd{background:var(--g800);color:#fff;animation:pop .45s var(--spring)}
.step.cur .sd{background:var(--gold);color:#fff}
.step.done,.step.cur{color:var(--g800)}
.step+.step::before{content:'';position:absolute;top:12px;right:50%;width:100%;height:2px;background:var(--cream-2)}
.step+.step::after{content:'';position:absolute;top:12px;right:50%;width:100%;height:2px;background:var(--g800);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.step.done::after,.step.cur::after{transform:scaleX(1)}
.sim{margin:18px 18px 0;padding:14px;border-radius:18px;border:2px dashed rgba(154,91,0,.45);background:repeating-linear-gradient(135deg,#fffaf0,#fffaf0 10px,#fff4e0 10px,#fff4e0 20px)}
.sim h3{font-size:15px;color:#6b3f00;display:flex;align-items:center;gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;width:100%;text-align:left}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid #b8c0bb;display:grid;place-items:center;transition:background-color .3s,border-color .3s;flex:none}
.cbox .icon{width:14px;height:14px;stroke:#fff;stroke-width:3;transform:scale(0);transition:transform .35s var(--spring)}
.cbox.on{background:var(--g800);border-color:var(--g800)}.cbox.on .icon{transform:scale(1)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900}
.st-requested{background:rgba(200,150,43,.16);color:var(--gold-d)}.st-ready{background:rgba(31,138,76,.13);color:var(--up)}
.st-completed{background:rgba(11,74,44,.1);color:var(--g800)}.st-cancelled,.st-expired{background:rgba(95,109,100,.12);color:var(--muted)}

/* ---------- account ---------- */
.profile{margin:8px 14px 0;padding:18px;display:flex;gap:14px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#12603A,#052414);color:var(--gold-l);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:700;flex:none}
.verified{display:inline-flex;align-items:center;gap:5px;background:rgba(31,138,76,.12);color:var(--up);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;margin-top:6px}
.list{margin:0 14px;overflow:hidden}
.li-row{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px;width:100%;text-align:left;transition:background-color .2s}
.li-row:active{background-color:rgba(11,74,44,.05)}
.li-row .lic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(11,74,44,.07);color:var(--g800);flex:none}
.li-row .end{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px}
.li-row+.li-row{border-top:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:999px;background:#cfd5d1;position:relative;transition:background-color .35s var(--ease);flex:none}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .45s var(--spring)}
.switch.on{background:var(--g700)}.switch.on i{transform:translateX(20px)}
.faq{border-top:1px solid var(--line)}
.faq:first-child{border-top:0}
.faq button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:10px 16px;text-align:left;font-weight:700;font-size:14px}
.faq .chev{transition:transform .4s var(--ease);color:var(--muted)}
.faq.open .chev{transform:rotate(90deg)}
.faq .ans{padding:0 16px 14px;font-size:14px;line-height:1.5;color:var(--muted);animation:enter .4s var(--ease)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table td,.table th{padding:10px 14px;text-align:left;border-top:1px solid var(--line)}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.table td:last-child,.table th:last-child{text-align:right}
textarea,select{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink);outline:none;transition:border-color .25s}
textarea:focus,select:focus{border-color:var(--gold)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.prose{padding:0 18px;font-size:14px;line-height:1.6}
.prose h3{font-size:16px;color:var(--g800);margin:18px 0 6px}

/* ---------- toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 96px);z-index:60;background:var(--g900);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);border:1px solid rgba(226,182,90,.3);animation:toast .5s var(--spring) both}
.toast .icon{color:var(--gold-l)}
@keyframes toast{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.guest-bar{margin:12px 14px 0;padding:10px 12px 10px 14px;border-radius:16px;background:#fff;border:1px solid rgba(200,150,43,.4);display:flex;align-items:center;gap:10px;font-size:13px}
.guest-bar button{margin-left:auto;min-height:40px;padding:0 14px;border-radius:12px;background:var(--g800);color:#fff;font-weight:900;font-size:13px}
.empty{margin:20px 18px;padding:24px;text-align:center;border-radius:20px;border:1.5px dashed rgba(11,74,44,.2);color:var(--muted);font-size:14px}

/* ---------- v3: shared bits ---------- */
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#d9472b;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;animation:pop .45s var(--spring) both;box-shadow:0 0 0 2px var(--g800)}
.badge.lt{box-shadow:0 0 0 2px var(--cream)}
.inp{width:100%;height:52px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:16px;color:var(--ink);padding:0 14px;outline:none;transition:border-color .25s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,150,43,.14)}
.inp.bad{border-color:rgba(179,65,46,.6)}
.hint{font-size:12px;margin-top:6px;color:var(--muted)}
.hint.err{color:var(--down)}
.segn{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--cream-2);border-radius:14px;padding:4px}
.segn .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:10px;background:#fff;box-shadow:0 4px 12px -4px rgba(11,74,44,.35);transition:transform .5s var(--spring)}
.segn button{position:relative;z-index:1;min-height:40px;font-weight:900;font-size:13px;color:var(--muted);transition:color .3s}
.segn button.on{color:var(--g800)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--g800);transition:transform .15s var(--ease),border-color .25s,background-color .25s}
.chipb:active{transform:scale(.94)}
.chipb.on{border-color:var(--gold);background:rgba(200,150,43,.1)}
.protobox{margin:16px 18px 0;padding:12px 14px;border-radius:16px;border:2px dashed rgba(154,91,0,.45);background:#fffaf0;color:#6b3f00;font-size:13px}
.protobox b{display:block;font-size:13px;margin-bottom:4px}
.cartbtn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--g800);background:#fff;border:1px solid var(--line);transition:transform .18s var(--ease)}
.cartbtn:active{transform:scale(.9)}
.cartbtn .bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
.limitbar{height:6px;border-radius:6px;background:var(--cream-2);overflow:hidden;margin-top:8px}
.limitbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g700),var(--g600));transform-origin:left;transition:transform .8s var(--ease)}
.limitbar.hi i{background:linear-gradient(90deg,#c0582f,#e48a54)}
.line{display:flex;align-items:center;gap:12px;padding:12px 14px}
.line+.line{border-top:1px solid var(--line)}
.rmbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:transform .15s var(--ease),color .2s}
.rmbtn:active{transform:scale(.88);color:var(--down)}
.dots4.err{animation:shake .45s var(--ease)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.keypad.off{opacity:.35;pointer-events:none;transition:opacity .3s}
.lock .note.warn{color:#ffb38f}
.login-note{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:#6b3f00;font-size:13px;display:flex;gap:8px;align-items:flex-start}

/* push banner (FR-N1) */
.push{position:absolute;left:10px;right:10px;top:calc(var(--top) + 6px);z-index:80;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:20px;background:rgba(252,250,244,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px -14px rgba(0,0,0,.5);border:1px solid rgba(200,150,43,.3);text-align:left;width:calc(100% - 20px);animation:pushIn .6s var(--spring) both}
.push.out{animation:pushOut .4s var(--ease) forwards}
@keyframes pushIn{from{transform:translateY(-130%)}to{transform:none}}
@keyframes pushOut{to{transform:translateY(-130%);opacity:0}}
.push b{display:block;font-size:14px}
.push .pt{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.nitem{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;position:relative}
.nitem+.nitem{border-top:1px solid var(--line)}
.nitem .ni{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(11,74,44,.08);color:var(--g800)}
.nitem .ni.alert{background:rgba(200,150,43,.16);color:var(--gold-d)}.nitem .ni.security{background:rgba(179,65,46,.1);color:var(--down)}
.nitem .ud{position:absolute;right:14px;top:16px;width:8px;height:8px;border-radius:50%;background:#d9472b}

/* rate card as button + history chart (FR-R5) */
.rate{cursor:pointer;transition:transform .2s var(--ease)}
.rate:active{transform:scale(.985)}
.rate-more{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:rgba(226,182,90,.85)}
.rate.silver .rate-more{color:rgba(232,237,240,.75)}
.chart-wrap{position:relative;margin-top:10px;user-select:none}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
.ch-line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
.ch-area{opacity:0;animation:fadeIn .9s .5s var(--ease) forwards}
.ch-grid{stroke:rgba(29,43,34,.08);stroke-dasharray:3 4}
.ch-lbl{font-size:10px;fill:var(--muted);font-family:var(--sans)}
.ch-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--g900);color:#fff;font-size:12px;padding:6px 9px;border-radius:10px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.ch-tip b{color:var(--gold-l)}
.ch-x{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats4 div{background:var(--cream);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.stats4 span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.stats4 b{font-size:13px;white-space:nowrap}
.alert-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.alert-row+.alert-row{border-top:1px solid var(--line)}

/* KYC (FR-A2) */
.kprog{height:4px;border-radius:4px;background:var(--cream-2);margin:0 18px;overflow:hidden}
.kprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));transform-origin:left;transition:transform .6s var(--ease)}
.kstep{display:flex;gap:12px;align-items:center;padding:12px 14px}
.kstep+.kstep{border-top:1px solid var(--line)}
.kstep .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(200,150,43,.15);color:var(--gold-d);font-weight:900;flex:none}
.idframe{position:relative;margin:16px auto 0;width:300px;height:190px;border-radius:18px;background:linear-gradient(160deg,#16251c,#0c1610);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:13px;text-align:center;padding:20px}
.idframe .cn{position:absolute;width:26px;height:26px;border:3px solid var(--gold-l)}
.idframe .cn.a{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.idframe .cn.b{right:12px;top:12px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.idframe .cn.c{left:12px;bottom:12px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.idframe .cn.d{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scanline{position:absolute;left:16px;right:16px;top:20px;height:2px;background:linear-gradient(90deg,transparent,#7be3a6,transparent);box-shadow:0 0 12px 2px rgba(123,227,166,.6);animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{to{transform:translateY(146px)}}
.idcard{width:250px;animation:pop .5s var(--spring) both}
.okmark{position:absolute;right:16px;bottom:16px;width:34px;height:34px;border-radius:50%;background:var(--up);color:#fff;display:grid;place-items:center;animation:pop .45s .2s var(--spring) both}
.okmark .icon{stroke-width:3}
.selfie{position:relative;margin:18px auto 0;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d3527,#0c1610);display:grid;place-items:center;overflow:hidden}
.selfie svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.selfie .ring circle{fill:none;stroke-width:5}
.selfie .ring .pr{stroke:var(--gold-l);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s linear forwards}
.selfie .face{opacity:.65}
.selfie.ok{background:radial-gradient(circle at 50% 40%,#1f5c3a,#0c2a19)}
.checking{width:84px;height:84px;margin:30px auto 0;animation:spin 1.1s linear infinite}
.kyc-badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;margin-top:6px}
.kyc-badge.verified{background:rgba(31,138,76,.12);color:var(--up)}
.kyc-badge.none,.kyc-badge.reverify{background:var(--warn-bg);color:var(--warn)}
.kyc-badge.pending{background:rgba(11,74,44,.08);color:var(--g700)}
.cta-card{margin:14px 14px 0;padding:14px 16px;display:flex;gap:12px;align-items:center;border-radius:18px;background:#fff;border:1.5px solid rgba(200,150,43,.45);text-align:left;width:calc(100% - 28px)}

/* dealer map (FR-D1) */
.map{margin:0 18px 12px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#e9efe4;position:relative}
.map svg{display:block;width:100%;height:auto}
.map .cap{position:absolute;right:8px;top:8px;font-size:10px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.8);padding:2px 7px;border-radius:6px}
.pin{cursor:pointer}
.pin .pg{transform-box:fill-box;transform-origin:50% 100%;transition:transform .45s var(--spring)}
.pin.on .pg{transform:scale(1.35) translateY(-2px)}
.pin.off{opacity:.45}
.you-ring{transform-box:fill-box;transform-origin:center;animation:ping 2s var(--ease) infinite}
.dact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dact a{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border-radius:10px;background:rgba(11,74,44,.07);color:var(--g800);font-size:11px;font-weight:900;text-decoration:none;white-space:nowrap}
div.choice{cursor:pointer}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .coin .ring,.check-disc path{stroke-dashoffset:0}
}
</style>
</head>

      <stop offset="0" stop-color="#1a7a4a"/><stop offset=".55" stop-color="#0B4A2C"/><stop offset="1" stop-color="#03180d"/>
    </radialGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>

    <linearGradient id="ingFrontG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B65A"/><stop offset=".55" stop-color="#C8962B"/><stop offset="1" stop-color="#8A6414"/></linearGradient>
    <linearGradient id="ingSideG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98A26"/><stop offset="1" stop-color="#6e4a0c"/></linearGradient>
    <linearGradient id="ingTopS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9dfe3"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d0d5"/></linearGradient>
    <linearGradient id="ingFrontS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eaed"/><stop offset=".55" stop-color="#b9c1c7"/><stop offset="1" stop-color="#7f8a92"/></linearGradient>
    <linearGradient id="ingSideS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5aeb4"/><stop offset="1" stop-color="#6a747b"/></linearGradient>

    <clipPath id="pgbxClip"><text x="100" y="146" text-anchor="middle" font-family="Lora, Georgia, serif" font-weight="700" font-size="34" letter-spacing="3">PGBX</text></clipPath>
  </defs>
</svg>
